<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Página de Captura</title>
  <style>
    body { font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; background-color: #f4f4f9; margin: 0; }
    .card { background: #fff; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
    h2 { margin-bottom: 20px; color: #333; text-align: center; }
    input[type="text"], input[type="email"] { width: 100%; padding: 10px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
    button { width: 100%; padding: 12px; background-color: #007bff; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; }
    button:hover { background-color: #0056b3; }
  </style>

  <!-- SCRIPT DE CAPTURA DE UTMS E AD_ID -->
  <script>
    (function() {
      const urlParams = new URLSearchParams(window.location.search);
      const params = ['utm_source', 'utm_medium', 'utm_campaign', 'utm_content', 'utm_term', 'ad_id', 'adset_id', 'campaign_id', 'gclid', 'fbclid'];
      
      let trackingData = {};
      params.forEach(param => {
        if (urlParams.has(param)) {
          trackingData[param] = urlParams.get(param);
        }
      });
      trackingData['page_url'] = window.location.origin + window.location.pathname;

      if (Object.keys(trackingData).length > 1) {
        sessionStorage.setItem('user_tracking', JSON.stringify(trackingData));
      }
    })();
  </script>
</head>
<body>

  <div class="card">
    <h2>Cadastre-se</h2>
    <form id="leadForm">
      <input type="text" id="nome" placeholder="Seu Nome" required>
      <input type="email" id="email" placeholder="Seu E-mail" required>
      
      <!-- Campos ocultos para enviar o rastreamento junto -->
      <input type="hidden" id="utm_source" name="utm_source">
      <input type="hidden" id="utm_medium" name="utm_medium">
      <input type="hidden" id="utm_campaign" name="utm_campaign">
      <input type="hidden" id="utm_content" name="utm_content">
      <input type="hidden" id="ad_id" name="ad_id">
      <input type="hidden" id="page_url" name="page_url">

      <button type="submit">Enviar Cadastramento</button>
    </form>
  </div>

  <script>
    // Preenche os campos ocultos com os dados capturados
    document.addEventListener("DOMContentLoaded", function() {
      const data = JSON.parse(sessionStorage.getItem('user_tracking') || '{}');
      for (const key in data) {
        const input = document.getElementById(key);
        if (input) input.value = data[key];
      }
    });

    // Envio do formulário
    document.getElementById('leadForm').addEventListener('submit', function(e) {
      e.preventDefault();
      
      const payload = {
        nome: document.getElementById('nome').value,
        email: document.getElementById('email').value,
        utm_source: document.getElementById('utm_source').value,
        utm_medium: document.getElementById('utm_medium').value,
        utm_campaign: document.getElementById('utm_campaign').value,
        utm_content: document.getElementById('utm_content').value,
        ad_id: document.getElementById('ad_id').value,
        page_url: document.getElementById('page_url').value,
        created_at: new Date().toISOString()
      };

      console.log("Dados prontos para envio ao Webhook:", payload);
      alert("Cadastro realizado! Veja no console do navegador o payload capturado.");
      // Aqui depois trocaremos o console.log pelo fetch() apontando para o seu Webhook no Make ou Supabase
    });
  </script>

</body>
</html>
